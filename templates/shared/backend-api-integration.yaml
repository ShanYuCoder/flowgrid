contexts:
  portalLayout: none
  routePrefixes: {}
  actors:
    - webhook-sender
  auth:
    - model: hmac-signature
      header: X-Signature
      notes: Document algorithm and secret env key in grill.

modules:
  - name: Integration
    purpose: Inbound webhooks and partner-facing APIs.
    entities:
      - name: WebhookEvent
        table: webhook_events
        mode: Platform
        aggregateRoot: false
        fields:
          - name: id
            type: integer
            readOnly: true
          - name: external_id
            type: string
            purpose: Idempotency / dedup key from provider.

api:
  endpoints:
    - id: integration.webhook
      module: Integration
      action: custom
      method: POST
      path: /webhooks/provider
      purpose: "Hứng webhook kết quả sự kiện từ đối tác bên thứ 3 và đồng bộ vào hệ thống"
      auth:
        required: true
        model: hmac-signature
      idempotency:
        required: true
        key: external_event_id
      sla:
        rateLimit: "100req/min"
        timeoutMs: 5000
      asyncEvents:
        - name: "ProviderWebhookReceived"
          eventType: "integration.webhook.received"
          topic: "webhooks.provider.events"
      resilience:
        timeoutMs: 5000
        retryPolicy:
          maxAttempts: 5
          backoff: "exponential" # exponential | fixed
          initialIntervalSec: 5
        dlqTopic: "webhooks.provider.dlq"
      dataMapping:
        - externalField: "event_id"
          internalField: "external_id"
          meaning: "Mã định danh giao dịch duy nhất từ phía đối tác để chống trùng lặp"
        - externalField: "status_code"
          internalField: "payment_status"
          meaning: "Trạng thái giao dịch phía đối tác được map sang enum hệ thống"
          transformRule: "MAP: {'00': 'SUCCESS', '01': 'FAILED'}"
      request: WebhookPayload
      response: WebhookAck
      onSpecificError:
        - statusCode: 401
          type: "UnauthorizedSignature"
          action: "Từ chối request nếu HMAC signature không khớp"
        - statusCode: 422
          type: "InvalidPayload"
          action: "Báo lỗi nếu thiếu trường bắt buộc event_id"
      tags:
        - "#webhook-inbound"

externalCalls: []

services: []

requests:
  WebhookPayload:
    fields:
      - name: id
        type: string
        meaning: "Mã sự kiện gửi từ đối tác"
        purpose: "Định danh payload webhook"
        rules:
          - required

responses:
  WebhookAck:
    fields:
      - name: received
        type: boolean
        meaning: "Cờ xác nhận hệ thống đã nhận và lưu webhook thành công"
        purpose: "Phản hồi HTTP 200 OK cho phía đối tác"

