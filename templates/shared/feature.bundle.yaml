      # 2. KIỂM SOÁT TƯƠNG TÁC (INTERACTION CONTROL)
      interactionControl:
        debounceMs: 500
        preventDoubleSubmit: true # Khóa nút ngay khi click
        loadingIndicator: "Đang lưu thông tin hồ sơ..."
        confirmDialog:
          required: false # Bật true nếu là hành động xóa/duyệt

      # 3. BIẾN ĐỔI DỮ LIỆU ĐẦU VÀO (PAYLOAD TRANSFORMATION)
      payloadTransformation:
