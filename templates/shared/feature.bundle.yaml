  # ĐẶC TẢ CHI TIẾT HÀNH ĐỘNG (ACTION FLOW SPECIFICATION — 6 KHỐI KỸ THUẬT)
  actions:
    - id: btn_save_record
      label: "Lưu & Xác Nhận"
      kind: button
      variant: primary
      position: form_footer
      meaning: "Chính thức lưu trữ dữ liệu vào hệ thống, chuyển đổi trạng thái đơn sang 'Đã tạo' và kích hoạt Job gửi tin tự động"
      purpose: "Thẩm định toàn bộ form và gửi dữ liệu lên máy chủ"
      trigger: click

      # 1. ĐIỀU KIỆN TIÊN QUYẾT (PRE-CONDITIONS)
      preconditions:
        uiState: "form.isValid == true"
        recordState: "record.status in ['DRAFT', 'REJECTED']"
        requiredPermissions: ["records.create", "records.edit"]
