schema: portal-feature-bundle/v1
id: role-domain-function
title: Feature API
status: draft
owner: fast-team
summary: Backend API bundle — mirror portal contract keys
specOrigin: requirement

grillStatus:
  bqaFacts: draft
  bqaOpen: draft
  dev: draft
  full: not_required

contractRef:
  portalIrSpec: surfaces/.../CMP-*/<slug>/code/W-*/ir/spec.yaml (or --id)

spec:
  feature:
    id: role-domain-function
    title: Feature API
    status: draft
    version: 0.1.0
  approval:
    status: draft
  api:
    endpoints:
      - id: feature.action
        module: feature
        action: action
        method: POST
        path: /feature/action
        purpose: "Tiếp nhận và thực thi thao tác nghiệp vụ chính từ giao diện hoặc dịch vụ khác"
        sla:
          rateLimit: "100/min"
          timeoutMs: 3000
        dataIntegrity:
          transactional: true
          concurrencyControl:
            strategy: "optimistic_locking" # optimistic_locking | pessimistic_locking | none
            versionField: "updated_at"
            onConflictStatus: 409
            conflictMessage: "Dữ liệu vừa được cập nhật bởi một phiên làm việc khác. Vui lòng thử lại."
        asyncEvents:
          - name: "FeatureActionExecutedEvent"
            topic: "feature.events"
            meaning: "Bắn sự kiện ngầm khi thao tác hoàn tất để xử lý đồng bộ dữ liệu và gửi thông báo"
        request: FeatureRequest
        response: FeatureResponse
        errorStorming:
          - code: 401
            tag: "#err:unauthorized"
            reason: "User not authenticated"
          - code: 403
            tag: "#err:idor-violation"
            reason: "Tenant IDOR violation or insufficient role permission"
          - code: 409
            tag: "#err:conflict"
            reason: "Concurrent edit conflict or unique constraint violation"
          - code: 422
            tag: "#err:validation"
            reason: "Invalid payload or boundary validation failure"
            fields: ["record_code", "record_name"]
  requests:
    FeatureRequest:
      fields:
        - name: record_code
          type: string
          meaning: "Mã định danh duy nhất của hồ sơ"
          purpose: "Nhập mã định danh duy nhất"
          validation:
            prototype: "slug_uppercase"
            required: true
            rules:
              - type: "regex"
                pattern: "^[A-Z0-9_-]{5,20}$"
              - type: "length"
                min: 5
                max: 20
            uniqueCheck:
              scope: "tenant_id"
              table: "records"
              column: "code"
        - name: record_name
          type: string
          meaning: "Tên định danh hiển thị của hồ sơ"
          purpose: "Nhập tên hồ sơ"
          validation:
            prototype: "text_clean"
            required: true
            rules:
              - type: "length"
                min: 3
                max: 100
  responses:
    FeatureResponse:
      fields:
        - name: result
          type: string
          meaning: "Mã trạng thái hoặc kết quả đầu ra chính thức của giao dịch"
          purpose: "Trả về kết quả phản hồi cho caller"

gen:
  codegen:
    module: feature
    entity: FeatureAction
    profile: command-stub # REQUIRED: auth | select-item | free | setting | export | import | dashboard-stats | list | create | edit | detail | admin-crud | command-stub
    skip: []

legacy:
  legacyRef: null
  behaviors: []
  fields: []
  ui: []
  evidence: []
  refs: {}

design:
  inherits: null
  shell:
    tag: "#shell: ApiModule"
  patterns: []
  zones: []
  behavior: {}
  actions:
    - id: feature.action
      label: Execute Feature Action
      trigger: button_click
      apiRefs: [ feature.action ]
      onSuccess:
        - Show success toast
      onCommonError:
        override: false
      onSpecificError:
        - condition: "422 Validation"
          notes: "Show inline validation errors"

  # Đa ngôn ngữ (i18n): Danh sách các bản dịch của error/validation messages trả về từ Backend (nếu có).
  # LƯU Ý: Email/SMS content lưu trong DB. Enum trả về số (1, 2) để FE tự dịch.
  i18n: {}
  #  "error_invalid_email":
  #    vi: "Email không hợp lệ"
  #    en: "Invalid email"

review:
  summary: Backend stub for portal wire
  layoutNotes: []


